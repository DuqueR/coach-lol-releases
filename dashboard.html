<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Coach LoL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B6FE0'/%3E%3Cpath d='M21.6 11A7.7 7.7 0 1 0 21.6 21' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.3' fill='%23fff'/%3E%3C/svg%3E">
<script>try{if(localStorage.getItem("coach-tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<style>
@font-face{font-family:"Archivo";src:url("/fuente/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
:root{
  --bg:#070A10; --bg2:#0A0E16; --s1:#0E131D; --s2:#131A26; --s3:#1A2231; --pozo:#090D14;
  --linea:rgba(255,255,255,.07); --linea2:rgba(255,255,255,.12); --linea3:rgba(255,255,255,.22);
  --t1:#EEF2F8; --t2:#A8B3C7; --t3:#7A879E; --t4:#465166;
  --az:#4DA3FF; --azf:#1B6FE0; --azs:rgba(77,163,255,.13);
  --rj:#FF5C6F; --rjs:rgba(255,92,111,.13);
  --vd:#2FD08A; --vds:rgba(47,208,138,.13);
  --am:#F2B544; --ams:rgba(242,181,68,.13);
  --or:#E3C16A; --ors:rgba(227,193,106,.12);
  --vi:#A995FF; --vis:rgba(169,149,255,.13);
  --en-az:#04101F; --en-rj:#22050A;
  --r:12px; --r2:8px; --r3:6px;
  --f:"Archivo","Segoe UI",system-ui,sans-serif;
  --sombra:0 18px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}
html[data-tema="claro"]{
  --bg:#EDF0F5; --bg2:#E6EAF1; --s1:#FFFFFF; --s2:#F4F6FA; --s3:#E9EDF4; --pozo:#EFF2F7;
  --linea:rgba(15,23,40,.09); --linea2:rgba(15,23,40,.15); --linea3:rgba(15,23,40,.28);
  --t1:#0F1728; --t2:#465269; --t3:#68748B; --t4:#A6AFC0;
  --az:#1D5BD0; --azf:#1D5BD0; --azs:rgba(29,91,208,.10);
  --rj:#CB3347; --rjs:rgba(203,51,71,.10);
  --vd:#0B7D55; --vds:rgba(11,125,85,.11);
  --am:#96630A; --ams:rgba(190,125,0,.14);
  --or:#8A680C; --ors:rgba(190,150,30,.16);
  --vi:#6247CF; --vis:rgba(98,71,207,.10);
  --en-az:#FFFFFF; --en-rj:#FFFFFF;
  --sombra:0 18px 50px rgba(20,30,50,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:430 14px/1.5 var(--f);font-stretch:100%;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-y:scroll}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--az);text-decoration:none}
b,strong{font-weight:680}
::selection{background:color-mix(in srgb,var(--az) 35%,transparent)}
:focus-visible{outline:2px solid var(--az);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:6px;border:2px solid var(--bg)}
@media (hover:hover){::-webkit-scrollbar-thumb:hover{background:var(--t4)}}
::-webkit-scrollbar-track{background:transparent}

/* ---------- voces de letra ---------- */
.dz{font-stretch:66%;font-weight:850;line-height:1;letter-spacing:.004em}
.nm{font-stretch:72%;font-weight:760;font-variant-numeric:lining-nums}
.tn{font-variant-numeric:tabular-nums lining-nums}
.et{font-stretch:112%;font-weight:660;font-size:10.5px;line-height:1.3;letter-spacing:.085em;text-transform:uppercase;color:var(--t3)}
.t2{color:var(--t2)} .t3{color:var(--t3)}
.c-az{color:var(--az)} .c-rj{color:var(--rj)} .c-vd{color:var(--vd)} .c-am{color:var(--am)} .c-or{color:var(--or)} .c-vi{color:var(--vi)}
.i{width:18px;height:18px;flex:none;display:block}
.i.s{width:14px;height:14px} .i.l{width:22px;height:22px}

/* ---------- marco ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.lat{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:18px 12px 14px;
  background:var(--bg2);border-right:1px solid var(--linea);z-index:30}
.marca{display:flex;align-items:center;gap:10px;padding:2px 8px}
.marca svg{width:30px;height:30px;flex:none}
.marca b{font-stretch:68%;font-weight:880;font-size:22px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.marca b i{font-style:normal;color:var(--az)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border:0;border-radius:9px;
  background:none;color:var(--t2);font-weight:600;font-size:14px;text-align:left;transition:background .12s,color .12s}
@media (hover:hover){.nav button:hover{background:var(--s2);color:var(--t1)}}
.nav button.on{background:var(--azs);color:var(--t1)}
.nav button.on .i{color:var(--az)}
.nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--az)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--s3);color:var(--t2);
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nav .cnt.av{background:var(--az);color:var(--en-az)}
.nav hr{border:0;border-top:1px solid var(--linea);margin:8px 8px}
.lat-pie{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.hoy-mini{padding:12px 12px 11px;border-radius:10px;background:var(--s1);border:1px solid var(--linea)}
.hoy-mini .fila{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hoy-mini .mk{font-size:24px;display:flex;gap:6px;align-items:baseline}
.hoy-mini .mk .v{color:var(--az)} .hoy-mini .mk .d{color:var(--rj)} .hoy-mini .mk s{text-decoration:none;color:var(--t4)}
.hoy-mini .pp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;color:var(--t3)}
.conx{display:flex;align-items:flex-start;gap:8px;padding:0 8px;font-size:12px;line-height:1.35;color:var(--t3)}
.conx .pt{width:7px;height:7px;border-radius:50%;background:var(--t4);margin-top:4px;flex:none}
.conx.on .pt{background:var(--vd);box-shadow:0 0 0 3px var(--vds)}
.lat-btns{display:flex;gap:6px;padding:0 2px}
.lat-btns button{flex:1;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--linea);background:none;color:var(--t3)}
@media (hover:hover){.lat-btns button:hover{color:var(--t1);border-color:var(--linea2);background:var(--s2)}}
@media (hover:hover){.lat-btns button.pel:hover{color:var(--rj);border-color:color-mix(in srgb,var(--rj) 50%,transparent)}}
.cuerpo{min-width:0;display:flex;flex-direction:column}
.tope{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:14px;padding:0 28px;
  border-bottom:1px solid var(--linea);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px) saturate(1.2)}
.tope h1{font-size:15px;font-weight:700;letter-spacing:.01em}
.tope .miga{color:var(--t3);font-size:13px}
.tope .der{margin-left:auto;display:flex;align-items:center;gap:12px}
.jug{display:flex;align-items:center;gap:10px}
.jug .pf{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--s3);border:1px solid var(--linea2)}
.jug .nb{font-weight:680;font-size:13.5px;line-height:1.2}
.jug .nb span{color:var(--t3);font-weight:500}
.jug .rg{font-size:12px;color:var(--t3);line-height:1.2}
main{width:100%;max-width:1660px;margin:0 auto;padding:22px 28px 70px}
main.entra>*{animation:funde .15s ease-out both}       /* se cambia de pantalla muchas veces: solo un fundido corto */
@keyframes funde{from{opacity:0}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ main.entra>*{animation:none} .sk{animation:none!important} }

/* ---------- rejilla ---------- */
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
.g.est{align-items:stretch}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.pila{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1320px){ .c7,.c8,.c9,.c5,.c4.ancha{grid-column:span 12} .c3{grid-column:span 6} .c4{grid-column:span 6} .c2{grid-column:span 4} }

/* ---------- tarjeta ---------- */
.card{position:relative;min-width:0;background:var(--s1);border:1px solid var(--linea);border-radius:var(--r);padding:18px 20px}
.card.pl{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:14px;min-height:22px}
.card-h h2{font-size:14.5px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.card-h h2 .i{color:var(--t3)}
.card-h .ay{margin-left:auto;font-size:12.5px;color:var(--t3);text-align:right;line-height:1.35}
.card-h .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.vacio{color:var(--t2);font-size:13.5px;line-height:1.55}
.nota-p{font-size:12.5px;color:var(--t3);line-height:1.5;margin-top:12px}
.sep{height:1px;background:var(--linea);margin:14px 0}

/* ---------- piezas ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:650;
  font-stretch:104%;background:var(--s3);color:var(--t2);white-space:nowrap;vertical-align:middle}
.chip .i{width:12px;height:12px}
.chip.az{background:var(--azs);color:var(--az)} .chip.rj{background:var(--rjs);color:var(--rj)}
.chip.vd{background:var(--vds);color:var(--vd)} .chip.am{background:var(--ams);color:var(--am)}
.chip.or{background:var(--ors);color:var(--or)} .chip.vi{background:var(--vis);color:var(--vi)}
.chip.ln{background:none;border:1px solid var(--linea2);color:var(--t2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;
  border:1px solid var(--linea2);background:var(--s3);color:var(--t1);font-weight:650;font-size:13.5px;white-space:nowrap;
  transition:background .12s,border-color .12s,filter .12s,transform .06s}
@media (hover:hover){.btn:hover{border-color:var(--linea3)}} .btn:active{transform:translateY(1px)}
.btn.p{background:var(--azf);border-color:transparent;color:#fff} @media (hover:hover){.btn.p:hover{filter:brightness(1.12)}}
.btn.f{background:transparent;border-color:transparent;color:var(--az);padding:0 6px;height:30px}
@media (hover:hover){.btn.f:hover{background:var(--azs)}}
.btn.pq{height:30px;font-size:12.5px;padding:0 11px;border-radius:7px}
.btn.gr{height:44px;font-size:15px;padding:0 20px;border-radius:10px}
@media (hover:hover){.btn.pe:hover{border-color:color-mix(in srgb,var(--rj) 55%,transparent);color:var(--rj)}}
.btn.rj{background:var(--rj);border-color:transparent;color:var(--en-rj)} @media (hover:hover){.btn.rj:hover{filter:brightness(1.08)}}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.enl{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;color:var(--az);font-weight:650;font-size:13px}
@media (hover:hover){.enl:hover{text-decoration:underline}}
.enl .i{width:14px;height:14px}
.seg{display:flex;gap:5px;align-items:center}
.seg i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--pozo);
  border:1px solid var(--linea2);color:var(--t4);font-style:normal}
.seg i svg{width:13px;height:13px}
.seg i.ok{background:var(--vds);border-color:color-mix(in srgb,var(--vd) 42%,transparent);color:var(--vd)}
.seg i.no{background:var(--rjs);border-color:color-mix(in srgb,var(--rj) 42%,transparent);color:var(--rj)}
.seg.ch i{width:18px;height:18px;border-radius:5px} .seg.ch i svg{width:10px;height:10px}
.seg small{margin-left:6px;font-size:12.5px;color:var(--t3)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--s3)}
.pips i.on{background:var(--az)} .pips i.mal{background:var(--rj)}
.tira{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%}
.tira i{height:6px;border-radius:2px;background:var(--s3)}
.mt{height:6px;border-radius:3px;background:color-mix(in srgb,var(--c,var(--az)) 17%,transparent);overflow:hidden}
.mt i{display:block;height:100%;border-radius:3px;background:var(--c,var(--az))}
.cp{--z:36px;width:var(--z);height:var(--z);border-radius:calc(var(--z)*.25);overflow:hidden;flex:none;display:inline-block;
  background:var(--s3);box-shadow:0 0 0 1px var(--linea2);vertical-align:middle;position:relative}
.cp img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.13)}
.cp.sin,.itm.sin,.rn.sin{display:inline-grid;place-items:center;font-size:calc(var(--z)*.34);font-weight:700;color:var(--t3);text-transform:uppercase}
.cp.rd{border-radius:50%}
.itm{--z:26px;width:var(--z);height:var(--z);border-radius:6px;overflow:hidden;flex:none;display:inline-block;background:var(--s3);
  box-shadow:0 0 0 1px var(--linea);vertical-align:middle}
.itm img{width:100%;height:100%;display:block}
.itm.vac{background:var(--pozo);box-shadow:inset 0 0 0 1px var(--linea)}
.its{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rn{--z:26px;width:var(--z);height:var(--z);border-radius:50%;flex:none;display:inline-block;background:var(--pozo);overflow:hidden;vertical-align:middle}
.rn img{width:100%;height:100%;display:block}
.rn.k{box-shadow:0 0 0 1px var(--linea2)}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-stretch:112%;font-weight:660;font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;color:var(--t3);
  text-align:left;padding:0 10px 8px;white-space:nowrap}
.tb td{padding:9px 10px;border-top:1px solid var(--linea);vertical-align:middle}
.tb .r{text-align:right} .tb .c{text-align:center}
@media (hover:hover){.tb tbody tr:hover td{background:color-mix(in srgb,var(--s2) 70%,transparent)}}
.tb td.nm{font-size:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:none}
.tabs button{position:relative;height:42px;padding:0 15px;background:none;border:0;color:var(--t2);font-weight:650;font-size:13.5px;
  display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
@media (hover:hover){.tabs button:hover{color:var(--t1);background:var(--s2)}}
.tabs button.on{color:var(--t1)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--az)}
.tabs .n{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--s3);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--t2)}
.tabs .n.av{background:var(--rjs);color:var(--rj)}
.campo{width:100%;min-height:38px;padding:9px 12px;border-radius:8px;border:1px solid var(--linea2);background:var(--pozo);color:var(--t1);
  resize:vertical;line-height:1.45}
.campo::placeholder{color:var(--t3)}
.campo:focus{outline:none;border-color:var(--az);box-shadow:0 0 0 3px var(--azs)}
select.campo{appearance:none;width:auto;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.gira{width:15px;height:15px;border-radius:50%;border:2px solid var(--linea2);border-top-color:var(--az);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.lst>li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;line-height:1.45}
.lst>li .i{margin-top:2px;color:var(--az)}
details.des>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--az);font-weight:650;font-size:13px;padding:4px 0}
details.des>summary::-webkit-details-marker{display:none}
details.des>summary .i{transition:transform .15s}
details.des[open]>summary .i{transform:rotate(90deg)}
details.des .cu{padding:10px 14px;margin-top:8px;border-radius:8px;background:var(--pozo);color:var(--t2);font-size:13.5px;display:grid;gap:8px}

/* ---------- ventanas y avisos ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(3,5,9,.74);backdrop-filter:blur(5px);
  opacity:0;transition:opacity .15s ease-out,display .15s allow-discrete}
html[data-tema="claro"] .modal{background:rgba(20,28,44,.45)}
.modal.on{display:grid;opacity:1;transition-duration:.2s}
@starting-style{.modal.on{opacity:0}}
.modal .modal-c{opacity:0;transform:scale(.96);transition:opacity .15s ease-out,transform .15s ease-out}
.modal.on .modal-c{opacity:1;transform:none;transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
@starting-style{.modal.on .modal-c{opacity:0;transform:scale(.96)}}
.modal-c{width:min(660px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--s1);border:1px solid var(--linea2);
  border-radius:16px;padding:26px 28px;box-shadow:var(--sombra)}
#toast{position:fixed;left:50%;bottom:26px;z-index:120;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 16px;border-radius:10px;background:var(--t1);color:var(--bg);font-weight:650;font-size:13.5px;box-shadow:var(--sombra);
  transition:opacity .15s ease-out,transform .15s ease-out;max-width:min(560px,90vw)}
#toast.on{opacity:1;transform:translate(-50%,0);transition-duration:.2s;transition-timing-function:var(--ease-out)}
#tip{position:fixed;z-index:130;pointer-events:none;display:none;max-width:300px;padding:6px 9px;border-radius:7px;
  background:#03060B;color:#EEF2F8;border:1px solid rgba(255,255,255,.14);font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tip b{font-weight:700}
#tip{transition:opacity .125s var(--ease-out),transform .125s var(--ease-out)}
@starting-style{#tip{opacity:0;transform:scale(.97)}}
#tip.instante{transition:none}

/* ============================ comunes de las vistas ============================ */
.chips{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button.chip{border:0;cursor:pointer;height:28px;padding:0 11px;font-size:12.5px;border-radius:8px;transition:background .12s,color .12s,border-color .12s}
button.chip.ln{border:1px solid var(--linea2)}
@media (hover:hover){button.chip.ln:hover{border-color:var(--linea3);color:var(--t1)}}
button.chip b{font-weight:700;opacity:.65;margin-left:1px}
button.chip .i{width:13px;height:13px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros.barra{margin:26px 0 0}
.sec-t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:22px 0 12px}
.sec-t .i{color:var(--t3)}

/* ============================ v26: movimiento y detalles ============================ */
:root{--ease-out:cubic-bezier(.23,1,.32,1)}
/* pulsar: el botón se hunde un poco (se nota que te ha oído) */
.btn{transition:background .12s,border-color .12s,filter .12s,transform .16s var(--ease-out)}
.btn:active:not(:disabled),button.chip:active{transform:scale(.97)}
/* botón que pasa por cargando / hecho / error sin cambiar de tamaño */
.btn[data-est]{position:relative;color:transparent!important;pointer-events:none}
.btn[data-est]>*:not(.btn-est){visibility:hidden}
.btn-est{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t1);animation:est-in .18s var(--ease-out)}
.btn.p .btn-est{color:#fff}
.btn[data-est="ok"]{background:var(--vds)!important;border-color:color-mix(in srgb,var(--vd) 45%,transparent)!important}
.btn[data-est="ok"] .btn-est{color:var(--vd)}
.btn[data-est="error"]{background:var(--rjs)!important;border-color:color-mix(in srgb,var(--rj) 45%,transparent)!important}
.btn[data-est="error"] .btn-est{color:var(--rj)}
@keyframes est-in{from{opacity:0;transform:scale(.92);filter:blur(2px)}}
/* pestañas y filtros: una sola marca que se desliza a la opción elegida */
.tabs,.filtros{position:relative}
.tabs-ind{position:absolute;left:0;bottom:-1px;width:100px;height:2px;border-radius:2px;background:var(--az);transform-origin:0 0;pointer-events:none;opacity:0}
.fil-ind{position:absolute;left:0;top:0;width:100px;height:28px;border-radius:8px;background:var(--azs);pointer-events:none;opacity:0}
.tabs-ind.listo,.fil-ind.listo{opacity:1}
.tabs-ind.anima{transition:transform .22s var(--ease-out)}
.fil-ind.anima{transition:transform .22s var(--ease-out),width .22s var(--ease-out)}
.tabs:has(.tabs-ind.listo) button.on::after{display:none}
.filtros:has(.fil-ind.listo) button.chip{position:relative;z-index:1}
.filtros:has(.fil-ind.listo) button.chip.az{background:transparent}
/* mini gráfica: pasa el ratón por encima para ver cada partida */
.ch-p rect{fill:transparent}
.ch-p .ch-d{opacity:0;transition:opacity .1s}
@media (hover:hover){.ch-p:hover .ch-d{opacity:1}}
/* cuándo juegas mejor */
.franjas{display:grid;grid-template-columns:24px repeat(6,minmax(0,1fr));gap:5px;max-width:560px}

/* buscador rápido (Ctrl+K): sin animación, se usa mucho */
#cmd{position:fixed;inset:0;z-index:140;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(3,6,11,.55)}

.cmd-pie{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--linea);font-size:11.5px;color:var(--t3)}

const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ""}</svg>`;

/* ---------- formato ---------- */
const mil = n => n == null || isNaN(n) ? "–" : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const dec = (x, d = 1) => x == null || isNaN(x) ? "–" : (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace(".", ",");
/* numero "natural": sin decimales desde 100, uno desde 10 y dos por debajo (252 · 47,7 · 0,78) */
const nat = v => { if(v == null) return "–"; if(typeof v !== "number") return String(v).replace(".", ",");
  const a = Math.abs(v), k = a >= 100 ? 1 : a >= 10 ? 10 : 100; return (v < 0 ? "−" : "") + (a >= 1000 ? mil(a) : String(Math.round(a * k) / k).replace(".", ",")); };
const sig = n => (n > 0 ? "+" : n < 0 ? "−" : "") + nat(Math.abs(n));
const may = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : "";
const min = t => t ? t.charAt(0).toLowerCase() + t.slice(1) : "";
const ROL = {top: "Top", jungla: "Jungla", mid: "Mid", bot: "ADC", support: "Support"};
function fechaCorta(f){
  if(!f) return "";
  const d = new Date(f.replace(" ", "T")), hoy = new Date(), ayer = new Date(Date.now() - 864e5), hh = f.slice(11, 16);
  if(d.toDateString() === hoy.toDateString()) return "hoy " + hh;
  if(d.toDateString() === ayer.toDateString()) return "ayer " + hh;
  return d.toLocaleDateString("es", {day: "numeric", month: "short"}).replace(".", "");
}
/* color de una nota del coach: los cortes los manda el coach (los mismos con los que escribe "jugaste bien / regular / mal") */
const tonoNota = n => { const q = (S.estado && S.estado.notas) || {bien: 7, regular: 4.5}; return n == null ? "" : n >= q.bien ? "vd" : n >= q.regular ? "am" : "rj"; };
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

/* ---------- piezas ---------- */
const ini2 = n => esc((n || "?").replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, "").slice(0, 2) || "?");
function cp(id, nombre, z = 36, cls = ""){
  const tip = nombre ? ` data-tip="${esc(nombre)}"` : "";
  if(!id || S.imgMal.has("/img/campeon/" + id)) return `<span class="cp sin ${cls}" style="--z:${z}px"${tip}>${ini2(nombre)}</span>`;
  return `<span class="cp ${cls}" style="--z:${z}px"${tip}><img src="/img/campeon/${id}" alt="${esc(nombre || "")}" loading="lazy" decoding="async"></span>`;
}
function itm(id, nombre, z = 26){
  if(!id) return `<span class="itm vac" style="--z:${z}px"></span>`;
  const tip = nombre ? ` data-tip="${esc(nombre)}"` : "";
  if(S.imgMal.has("/img/item/" + id)) return `<span class="itm sin" style="--z:${z}px"${tip}>${ini2(nombre)}</span>`;
  return `<span class="itm" style="--z:${z}px"${tip}><img src="/img/item/${id}" alt="${esc(nombre || "")}" loading="lazy" decoding="async"></span>`;
}
function rn(x, z = 26, cls = ""){
  if(!x || !x.id) return "";
  if(S.imgMal.has("/img/runa/" + x.id)) return z < 20 ? "" : `<span class="rn sin ${cls}" style="--z:${z}px" data-tip="${esc(x.nombre || "")}">${ini2(x.nombre)}</span>`;
  return `<span class="rn ${cls}" style="--z:${z}px" data-tip="${esc(x.nombre || "")}"><img src="/img/runa/${x.id}" alt="${esc(x.nombre || "")}" loading="lazy" decoding="async"></span>`;
}
const its = (lista, z = 26, hasta = 0) => `<span class="its">${(lista || []).map(i => itm(i.id, i.nombre, z)).join("")}${Array.from({length: Math.max(0, hasta - (lista || []).length)}, () => itm(0, "", z)).join("")}</span>`;
function seg(n, res, tit, cls = ""){
  const r = res || [];
  return `<span class="seg ${cls}">${Array.from({length: n}, (_, i) => { const x = r[i];
    return x ? `<i class="${x.ok ? "ok" : "no"}" data-tip="${esc(tit ? tit(x) : "")}">${ic(x.ok ? "ok" : "no")}</i>` : `<i data-tip="Partida por jugar"></i>`; }).join("")}</span>`;
}
const pips = (n, max, mal) => `<span class="pips" aria-label="${n} de ${max}">${Array.from({length: max}, (_, i) => `<i class="${i < n ? (mal ? "mal" : "on") : ""}"></i>`).join("")}</span>`;
function tira(nota, tono){
  const c = `var(--${tono || tonoNota(nota) || "az"})`;
  return `<span class="tira" role="img" aria-label="${dec(nota)} de 10">${Array.from({length: 10}, (_, i) => {
    const f = Math.max(0, Math.min(1, (nota || 0) - i));
    return `<i style="${f >= 1 ? `background:${c}` : f > 0 ? `background:linear-gradient(90deg,${c} ${Math.round(f * 100)}%,var(--s3) 0)` : ""}"></i>`; }).join("")}</span>`;
}
const metro = (pct, tono = "az") => `<span class="mt" style="--c:var(--${tono})"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>`;
/* barra que sale del centro: a la derecha (azul) por encima de la referencia, a la izquierda (rojo) por debajo */
function dv(d, tope = 10){
  const p = Math.max(-1, Math.min(1, d / tope)) * 50;
  return `<span class="dv"><i style="${p >= 0 ? `left:50%;width:${p.toFixed(1)}%` : `left:${(50 + p).toFixed(1)}%;width:${(-p).toFixed(1)}%`};background:var(--${p >= 0 ? "az" : "rj"})"></i></span>`;
}
const origenReto = r => r.origen === "IA" ? `<span class="chip vi">${ic("ia")}Te lo puso la IA</span>` : r.origen === "coach" ? `<span class="chip az">Te lo puso el coach</span>` : `<span class="chip">Lo elegiste tú</span>`;
const metaReto = r => r.meta == null ? "meta en camino" : `${r.menor ? "≤" : "≥"} ${nat(r.meta)}${r.unidad ? " " + esc(r.unidad) : ""}`;
/* un bloque que falla no deja la pantalla en blanco */
function B(fn, ...a){
  try{ return fn(...a) || ""; }
  catch(e){ console.error(e); return `<section class="card"><p class="vacio">No pude dibujar este bloque (${esc(e.message)}).</p></section>`; }
}

/* ---------- morph: deja el nodo "a" igual que "b" tocando lo minimo ---------- */
const claveDe = n => n.nodeType === 1 ? (n.getAttribute("data-k") || n.id || null) : null;
const mismo = (x, y) => x.nodeType === y.nodeType && (x.nodeType !== 1 || (x.tagName === y.tagName && claveDe(x) === claveDe(y)));
function atributos(a, b){
  for(const {name, value} of [...b.attributes]) if(a.getAttribute(name) !== value) a.setAttribute(name, value);
  for(const {name} of [...a.attributes]) if(!b.hasAttribute(name) && !(name === "open" && a.tagName === "DETAILS")) a.removeAttribute(name);
}
function morph(a, b){
  if(a.nodeType === 1 && b.nodeType === 1){
    if(a.hasAttribute("data-fijo")) return;
    atributos(a, b);
    if(a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.tagName === "SELECT") return;     // lo que escribes no se pisa
  }
  let x = a.firstChild, y = b.firstChild, mapa = null;
  while(y){
    const sigY = y.nextSibling;
    let m = null;
    if(x && mismo(x, y)) m = x;
    else {
      const k = claveDe(y);
      if(k){
        if(!mapa){ mapa = new Map(); for(let n = x; n; n = n.nextSibling){ const kk = claveDe(n); if(kk) mapa.set(kk, n); } }
        const c = mapa.get(k);
        if(c && c.parentNode === a && c.tagName === y.tagName) m = c;
      } else if(x && x.nextSibling && !claveDe(x) && mismo(x.nextSibling, y)){
        const viejo = x; x = x.nextSibling; a.removeChild(viejo); m = x;
      }
    }
    if(m){
      if(m === x) x = x.nextSibling; else a.insertBefore(m, x);
      if(m.nodeType !== 1){ if(m.data !== y.data) m.data = y.data; }
      else if(!m.isEqualNode(y)) morph(m, y);
    } else a.insertBefore(y, x);
    y = sigY;
  }
  while(x){ const n = x.nextSibling; a.removeChild(x); x = n; }
}
const _tpl = document.createElement("template");
function poner(el, html){
  if(!el) return;
  if(el.__html === html) return;                 // misma plantilla que la ultima vez: ni se mira
  el.__html = html;
  _tpl.innerHTML = html;
  morph(el, _tpl.content);
}

/* ---------- avisos pequeños ---------- */
function confirmar(titulo, texto, boton, peligro){
  return new Promise(res => {
    poner($("#conf-c"), `<h2 id="conf-t">${esc(titulo)}</h2><p class="t2">${esc(texto)}</p>
      <div class="rev-acc"><button class="btn" data-a="conf-no">Cancelar</button><button class="btn ${peligro ? "rj" : "p"}" data-a="conf-si" id="conf-si">${esc(boton)}</button></div>`);
    confirmar._r = res; $("#conf").classList.add("on"); $("#conf-si").focus();
  });
}
const COMPACTA = matchMedia("(max-width:1500px)");        /* ventana mediana: el menú se pliega a iconos */
/* Los gráficos se dibujan al ancho real de su hueco (así el texto no se encoge): cada hueco lleva data-ancho="nombre". */
function medir(){
  let cambio = false;
  for(const el of $$("[data-ancho]")){
    const k = el.dataset.ancho, w = Math.round(el.clientWidth);
    if(w > 60 && Math.abs((S.anchos[k] || 0) - w) > 4){ S.anchos[k] = w; cambio = true; }
  }
  return cambio;
}
function cerrarConf(v){ $("#conf").classList.remove("on"); const r = confirmar._r; confirmar._r = null; if(r) r(v); }
/* aviso abajo. Con "deshacer" (una función) lleva el botón Deshacer y dura 6 s; con el ratón encima no se va */
function toast(t, deshacer){
  const el = $("#toast"); if(!t) return;
  const ms = deshacer ? 6000 : 3200;
  el.innerHTML = esc(t) + (deshacer ? `<button class="tst-b" type="button">Deshacer</button><i class="tst-bar" style="animation-duration:${ms}ms"></i>` : "");
  el.classList.toggle("acc", !!deshacer); el.classList.add("on");
  let resta = ms, desde = Date.now();
  const pausas = new Set();                     /* "raton" y/o "oculta": el tiempo solo corre si no hay ninguna */
  el.classList.remove("pausa");
  const cerrar = () => { clearTimeout(toast._t); el.classList.remove("on", "acc", "pausa"); el.onmouseenter = el.onmouseleave = null; toast._vis = null;
    const b = el.querySelector(".tst-b"); if(b) b.onclick = null; };
  const programar = () => { clearTimeout(toast._t); desde = Date.now(); toast._t = setTimeout(cerrar, Math.max(resta, 0)); };
  const pausar = motivo => { if(!pausas.size){ clearTimeout(toast._t); resta -= Date.now() - desde; el.classList.add("pausa"); } pausas.add(motivo); };
  const seguir = motivo => { pausas.delete(motivo); if(!pausas.size){ el.classList.remove("pausa"); programar(); } };
  programar();

(function(){
  const tip = () => $("#tip");
  /* La primera vez espera 350 ms (asi no salen al cruzar la pantalla con el raton); si ya habia uno abierto
     o se cerro hace nada, el siguiente sale al instante y sin animacion: recorrer una fila de casillas es fluido. */
  let actual = null, visible = false, cerradoEn = 0, espera = 0;
  const ocultar = () => { clearTimeout(espera); if(visible) cerradoEn = Date.now(); actual = null; visible = false; tip().style.display = "none"; };
  const mostrar = (el, instante) => {
    const t = tip(); t.textContent = el.dataset.tip || el.dataset.tipc;
    t.classList.toggle("instante", instante); t.style.display = "block";
    const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
    let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8, abajo = false;
    if(y < 6){ y = r.bottom + 8; abajo = true; }
    const xx = Math.max(6, Math.min(x, innerWidth - w - 6));
    t.style.left = xx + "px"; t.style.top = y + "px";
    t.style.transformOrigin = `${Math.round(r.left + r.width / 2 - xx)}px ${abajo ? "0" : "100%"}`;   /* crece desde el elemento */
    visible = true;
  };
  document.addEventListener("mouseover", e => {
    let el = e.target.closest && e.target.closest("[data-tip],[data-tipc]");
    if(el && !el.dataset.tip && !(el.dataset.tipc && COMPACTA.matches)) el = null;      /* data-tipc: solo con el menú plegado */
    if(!el){ if(actual) ocultar(); return; }
    if(el === actual) return;
    const seguido = visible || Date.now() - cerradoEn < 400;
    clearTimeout(espera); actual = el;
    if(seguido){ if(visible) cerradoEn = Date.now(); mostrar(el, true); }
    else { tip().style.display = "none"; espera = setTimeout(() => { if(actual === el && el.isConnected && (el.dataset.tip || (el.dataset.tipc && COMPACTA.matches))) mostrar(el, false); }, 350); }
  });
  document.addEventListener("scroll", ocultar, true);
  document.addEventListener("mousedown", ocultar, true);
})();

/* ---------- detalles de movimiento tras cada repintado ---------- */
const MENOS_MOV = matchMedia("(prefers-reduced-motion: reduce)");
const _contados = new WeakSet(), _cuentaVista = new Map();     /* clave -> ultimo valor contado en esta sesion */
function efectos(){
  /* números que suben hasta su valor la primera vez que aparecen (EasyUI "Stat Card") */
  for(const n of $$("[data-cu]")){
    if(_contados.has(n)) continue;
    _contados.add(n);
    const fin = +n.dataset.cu, d = +(n.dataset.dec || 0), k = n.dataset.cuk;
    if(k){ const ya = _cuentaVista.get(k); _cuentaVista.set(k, fin); if(ya === fin) continue; }
    if(MENOS_MOV.matches || !isFinite(fin) || fin === 0) continue;
    const t0 = performance.now(), dur = 650;
    const paso = ahora => {
      if(!n.isConnected) return;
      const k = Math.min(1, (ahora - t0) / dur), e = 1 - Math.pow(1 - k, 3), meta = +n.dataset.cu;   /* el repintado puede cambiarlo */
      n.textContent = dec(k < 1 ? meta * e : meta, d);
      if(k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }
  /* marca de la pestaña o filtro elegido: se desliza en vez de saltar */
  for(const ind of $$(".tabs-ind, .fil-ind")){
    const caja = ind.parentElement, on = caja.querySelector(ind.classList.contains("tabs-ind") ? "button.on" : "button.chip.az");
    if(!on){ ind.classList.remove("listo"); continue; }
    const x = on.offsetLeft, y = on.offsetTop, w = on.offsetWidth;
    if(ind.classList.contains("tabs-ind")) ind.style.transform = `translateX(${x}px) scaleX(${w / 100})`;
    else { ind.style.transform = `translate(${x}px,${y}px)`; ind.style.width = w + "px"; ind.style.height = on.offsetHeight + "px"; }
    if(!ind.classList.contains("listo")){ ind.classList.add("listo"); void ind.offsetWidth; }
    ind.classList.add("anima");                 /* la primera vez se coloca sin moverse; desde ahí, se desliza */
  }
}

function confeti(){
  if(MENOS_MOV.matches) return;
  const cv = document.createElement("canvas"); cv.id = "confeti"; document.body.appendChild(cv);
  const dpr = devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, c = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement), col = ["--az", "--vd", "--or", "--vi", "--rj"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length: 140}, (_, i) => { const iz = i % 2 === 0, a = (iz ? -60 : -120) * Math.PI / 180 + (Math.random() - .5) * .9, v = (9 + Math.random() * 9) * dpr;
    return {x: iz ? 0 : W, y: H * .75, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: (5 + Math.random() * 5) * dpr, h: (3 + Math.random() * 4) * dpr, c: col[i % col.length]}; });
  const t0 = performance.now();
  (function cuadro(t){
    const k = (t - t0) / 1800; c.clearRect(0, 0, W, H);
    for(const p of P){ p.vy += .32 * dpr; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.globalAlpha = Math.max(0, 1 - Math.max(0, k - .6) / .4); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
    if(k < 1) requestAnimationFrame(cuadro); else cv.remove();
  })(t0);
}

function chispa(vals, tono = "az", W = 132, H = 34, tips = null){
  const idx = vals.map((x, i) => x != null ? i : -1).filter(i => i >= 0), v = idx.map(i => vals[i]);
  if(v.length < 3) return "";
  let lo = Math.min(...v), hi = Math.max(...v); if(hi === lo){ hi += 1; lo -= 1; }
  const X = i => 3 + (W - 9) * i / (v.length - 1), Y = x => 4 + (H - 8) * (1 - (x - lo) / (hi - lo));
  const d = v.map((x, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(x).toFixed(1)).join(" ");
  /* con "tips": cada punto tiene su franja invisible; al pasar el ratón se marca el punto y sale su partida */
  const paso = (W - 9) / (v.length - 1);
  const zonas = tips ? v.map((x, i) => `<g class="ch-p" data-tip="${esc(tips[idx[i]] || "")}"><rect x="${Math.max(0, X(i) - paso / 2).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${H}"/>
      <circle class="ch-d" cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="3.5" fill="var(--t1)" stroke="var(--s1)" stroke-width="1.5"/></g>`).join("") : "";
  return `<svg class="chispa" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" ${tips ? 'role="img" aria-label="Tu nota en cada partida"' : 'aria-hidden="true"'}>
    <path d="${d}" fill="none" stroke="var(--t4)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(v.length - 1).toFixed(1)}" cy="${Y(v[v.length - 1]).toFixed(1)}" r="4" fill="var(--${tono})" stroke="var(--s1)" stroke-width="2"/>${zonas}</svg>`;
}
/* curva suave (sin pasarse de los puntos) con el área debajo en degradado, para las tarjetas de rendimiento */
function curva(vals, tono, k, W = 110, H = 40){
  const v0 = vals.filter(x => x != null);
  const v = v0.map((x, i) => { const a = v0.slice(Math.max(0, i - 1), i + 2); return a.reduce((s, y) => s + y, 0) / a.length; });   /* media de 3: la tendencia, no el ruido */
  if(v.length < 3) return `<svg width="${W}" height="${H}" aria-hidden="true"></svg>`;
  let lo = Math.min(...v), hi = Math.max(...v); if(hi === lo){ hi += 1; lo -= 1; }
  const X = i => 2 + (W - 8) * i / (v.length - 1), Y = x => 5 + (H - 10) * (1 - (x - lo) / (hi - lo));
  let d = `M${X(0).toFixed(1)} ${Y(v[0]).toFixed(1)}`;
  for(let i = 1; i < v.length; i++){ const xm = ((X(i - 1) + X(i)) / 2).toFixed(1);
    d += ` C${xm} ${Y(v[i - 1]).toFixed(1)} ${xm} ${Y(v[i]).toFixed(1)} ${X(i).toFixed(1)} ${Y(v[i]).toFixed(1)}`; }
  const area = `${d} L${X(v.length - 1).toFixed(1)} ${H} L${X(0).toFixed(1)} ${H} Z`, col = `var(--${tono || "t2"})`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><defs><linearGradient id="cg-${k}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#cg-${k})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(v.length - 1).toFixed(1)}" cy="${Y(v[v.length - 1]).toFixed(1)}" r="3" fill="${col}" stroke="var(--s2)" stroke-width="1.5"/></svg>`;
}

  const tiles = MET_REND.map(m => {

    const tono = dif == null || dif === 0 ? "" : dif > 0 ? "vd" : "rj";

    const dl = dif == null ? `<span class="rt-d no">${ps.length === 1 ? "1 partida" : `media de ${Math.min(10, ps.length)}`}</span>`
      : dif === 0 ? `<span class="rt-d no">igual que antes</span>`
      : `<span class="rt-d c-${tono}" data-tip="${tipD}">${ic(dif > 0 ? "sube" : "baja")}${dif > 0 ? "+" : "−"}${dec(Math.abs(dif), m.d)}</span>`;

  const chips = [r.historia ? `<span class="chip ${p.victoria ? "vd" : "rj"}">${esc(r.historia)}</span>` : "",
    r.max && r.max.dif > 0 ? `<span class="chip ln">Máxima ventaja: <b class="nm">${firmado(r.max.dif)}</b> (min ${Math.floor(r.max.m)})</span>` : "",

  return `<div class="pila">

    </section>
    ${t.momentos.length ? `<section class="card" aria-label="Momentos clave"><div class="card-h"><h2>${ic("rayo")}Los momentos que decidieron la partida</h2><span class="ay">Los mayores cambios de oro en 2 minutos</span></div>
      <ol class="mts">${t.momentos.map(m => `<li class="mmt ${m.bien ? "bien" : "mal"}">
        <span class="mt-t nm">${mmss(m.desde)}<small>${mmss(m.hasta)}</small></span>
        <div class="mt-c"><b>${m.bien ? "Tu equipo gana" : "Tu equipo pierde"} ${mil(Math.abs(m.dif))} de oro</b>
          <p>${esc(m.que.charAt(0).toUpperCase() + m.que.slice(1))}</p><p class="mt-l">${esc(m.leccion)}</p>
          <span class="chip ln nm">Prob. de ganar ${m.pv_antes}% → ${m.pv_despues}%</span></div>
        <button class="btn pq" data-a="ver" data-s="${m.seg}" data-tip="Abre la repetición 15 segundos antes">${ic("play", "s")}Ver</button></li>`).join("")}</ol></section>` : ""}
  </div>`;
}
function grafTiempo(t, k){
  const ser = t.serie, def = SERIES_T[k], W = 720, H = 268, L = 46, Rr = 12, T = 12, B = 200;
  const pts = ser.map(s => [s.m, def.v(s)]).filter(x => x[1] != null);
  if(pts.length < 2) return `<p class="dim">Sin datos para esta gráfica.</p>`;
  const maxM = Math.max(...ser.map(s => s.m), 1);
  let lo, hi, base;
  if(def.pct){ lo = 0; hi = 100; base = 50; }
  else { const a = Math.max(...pts.map(x => Math.abs(x[1])), 1); const paso = a > 4000 ? 2000 : a > 1500 ? 1000 : a > 600 ? 500 : a > 150 ? 100 : a > 40 ? 20 : 5;
    hi = Math.ceil(a / paso) * paso; lo = -hi; base = 0; }
  const X = m => L + m / maxM * (W - L - Rr), Y = v => T + (hi - v) / (hi - lo) * (B - T);
  const linea = pts.map((x, i) => `${i ? "L" : "M"}${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("");
  const area = `${linea}L${X(pts[pts.length - 1][0]).toFixed(1)},${Y(base).toFixed(1)}L${X(pts[0][0]).toFixed(1)},${Y(base).toFixed(1)}Z`;
  const marcas = def.pct ? [0, 25, 50, 75, 100] : [lo, lo / 2, 0, hi / 2, hi];
  const fmt = v => def.pct ? v + "%" : firmado(v);
  const grid = marcas.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" class="${v === base ? "g0" : "g1"}"/><text x="${L - 6}" y="${Y(v) + 4}" class="gy">${fmt(v)}</text>`).join("");
  const xs = []; for(let m = 0; m <= maxM; m += 5) xs.push(`<text x="${X(m)}" y="${H - 4}" class="gx">${m}</text>`);
  const tip = e => esc(`${mmss(e.ts / 60000)} · ` + ({muerte: `Moriste (te mató ${e.asesino})`, kill: `Mataste a ${e.victima}`, asist: `Asistencia en ${e.victima}`,
    kill_eq: `Tu equipo mató a ${e.victima}`, muerte_eq: `Cayó ${e.victima} (de los tuyos)`,
    objetivo: `${e.nuestro ? "Tu equipo" : "Ellos"} tomaron ${e.nombre}`, torre: `${e.nuestro ? "Tu equipo destruyó" : "Perdisteis"} ${e.nombre}`}[e.tipo] || ""));
  const ev = t.eventos.map(e => { const x = X(e.ts / 60000).toFixed(1);
    if(e.tipo === "muerte") return `<g data-tip="${tip(e)}" class="ev"><path d="M${x - 5},${B + 13}l10,10M${+x + 5},${B + 13}l-10,10" class="k-muerte"/><rect x="${x - 7}" y="${B + 10}" width="14" height="16" fill="transparent"/></g>`;
    if(e.tipo === "kill") return `<g data-tip="${tip(e)}" class="ev"><circle cx="${x}" cy="${B + 18}" r="5" class="k-kill"/></g>`;
    if(e.tipo === "asist") return `<g data-tip="${tip(e)}" class="ev"><circle cx="${x}" cy="${B + 18}" r="2.6" class="k-kill"/></g>`;
    if(e.tipo === "objetivo") return `<g data-tip="${tip(e)}" class="ev"><rect x="${x - 7}" y="${B + 32}" width="14" height="14" rx="3" class="k-obj ${e.nuestro ? "n" : "s"}"/><text x="${x}" y="${B + 42.5}" class="k-sig">${esc(e.sigla)}</text></g>`;
    if(e.tipo === "torre") return `<g data-tip="${tip(e)}" class="ev"><path d="M${x},${B + 33}l6,11h-12z" class="k-torre ${e.nuestro ? "n" : "s"}"/></g>`;
    return ""; }).join("");
  return `<div class="mt-g"><svg class="mt-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(def.t)} por minuto" data-l="${L}" data-w="${W - L - Rr}" data-max="${maxM}" data-k="${k}">
    <defs><clipPath id="mt-arr"><rect x="0" y="0" width="${W}" height="${Y(base)}"/></clipPath><clipPath id="mt-aba"><rect x="0" y="${Y(base)}" width="${W}" height="${H}"/></clipPath></defs>
    ${grid}${xs.join("")}
    <path d="${area}" class="a-bien" clip-path="url(#mt-arr)"/><path d="${area}" class="a-mal" clip-path="url(#mt-aba)"/>
    <path d="${linea}" class="ln-t"/>
    <line id="mt-cur" x1="-10" x2="-10" y1="${T}" y2="${B}" class="cur"/>
    <line x1="${L}" x2="${W - Rr}" y1="${B + 28}" y2="${B + 28}" class="g1"/>${ev}</svg></div>`;
}
document.addEventListener("pointermove", ev => {
  const svg = ev.target.closest && ev.target.closest(".mt-svg"); const t = S.partida && S.partida.tiempo;

  const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * 720;

});

/* ---------- pestaña Muertes ---------- */
const oroDim = () => { const W = S.anchos.oro || 900; return {W, H: Math.round(Math.max(236, Math.min(340, W * .37))), L: 58, R: 62, T: 14, B: 28}; };
function oroGeo(p){
  const s = p.oro_serie || [], {W, H, L, R, T, B} = oroDim();
  const tmax = s[s.length - 1][0], vals = s.map(x => x[1]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);                 /* el eje se ajusta a lo que pasó, siempre con el 0 a la vista */
  if(hi - lo < 2000){ hi = Math.max(hi, 1000); lo = Math.min(lo, -1000); }   /* partida muy pareja: que 300 de oro no parezcan un abismo */
  const ms = marcasEje(lo, hi, 6), paso = ms.length > 1 ? ms[1] - ms[0] : 1000;
  lo = Math.floor(lo / paso + 1e-9) * paso; hi = Math.ceil(hi / paso - 1e-9) * paso;
  return {s, tmax, paso, lo, hi, x: t => L + (W - L - R) * t / tmax, y: v => T + (H - T - B) * (hi - v) / (hi - lo),
    en: t => { let a = s[0]; for(const d of s){ if(d[0] <= t) a = d; else { const f = (t - a[0]) / ((d[0] - a[0]) || 1); return a[1] + (d[1] - a[1]) * f; } } return a[1]; }};
}
function graficoOro(p){
  const s = p.oro_serie || []; if(s.length < 6) return "";
  const {W, H, L, R, T, B} = oroDim(), g = oroGeo(p), y0 = g.y(0);
  const linea = s.map((d, i) => (i ? "L" : "M") + g.x(d[0]).toFixed(1) + " " + g.y(d[1]).toFixed(1)).join(" ");
  const area = `${linea} L${g.x(g.tmax).toFixed(1)} ${y0} L${g.x(0).toFixed(1)} ${y0} Z`;
  let ejes = "";
  for(let v = g.lo; v <= g.hi + 1; v += g.paso) ejes += `<line x1="${L}" x2="${W - R}" y1="${g.y(v)}" y2="${g.y(v)}" class="${v ? "gl" : "g0"}"/><text x="${L - 8}" y="${g.y(v) + 4}" text-anchor="end">${v > 0 ? "+" : v < 0 ? "−" : ""}${mil(Math.abs(v))}</text>`;

/* marcas del eje con numeros redondos (1, 2 o 5 por potencia de 10), buscando unas "n" marcas */
function marcasEje(lo, hi, n = 4){
  const rango = (hi - lo) || 1, mag = 10 ** Math.floor(Math.log10(rango));
  let mejor = null;
  for(const m of [mag / 10, mag]) for(const k of [1, 2, 5]){
    const paso = m * k, cuenta = Math.floor(hi / paso + 1e-9) - Math.ceil(lo / paso - 1e-9) + 1;
    if(cuenta >= 2 && (!mejor || Math.abs(cuenta - n) < Math.abs(mejor.cuenta - n))) mejor = {paso, cuenta};
  }
  const paso = mejor ? mejor.paso : rango, t = [];
  for(let v = Math.ceil(lo / paso - 1e-9) * paso; v <= hi + paso * 1e-6; v += paso) t.push(Math.round(v * 1e6) / 1e6);
  return t;
}

function mini(serie, campo, o){
  const pts = serie.map((g, i) => ({i, v: g[campo], g})).filter(x => x.v != null);
  if(pts.length < 3) return `<div class="mini"><h3>${o.titulo}</h3><p class="vacio" style="margin-top:8px">Faltan partidas para ver la tendencia${o.sinSupport ? " (las de support no cuentan aquí)" : ""}.</p></div>`;
  const W = S.anchos.mini || 360, H = 176, pl = 40, pr = 46, pt = 12, pb = 12;
  const fmt = v => o.signo ? sig(Math.round(v)) : o.dec ? dec(v, o.dec) : mil(Math.round(v));
  let lo, hi;
  if(o.dominio) [lo, hi] = o.dominio;
  else {
    const vals = pts.map(x => x.v).concat(o.meta != null ? [o.meta] : []);
    lo = Math.min(...vals); hi = Math.max(...vals);
    if(hi === lo){ hi += 1; lo -= 1; }
    const aire = (hi - lo) * .1; hi += aire; lo = o.cero ? 0 : lo - aire;
  }
  const n = serie.length, X = i => pl + (W - pl - pr) * (n > 1 ? i / (n - 1) : .5), Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));

  for(const t of marcasEje(lo, hi, 4)) s += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${pl - 8}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${o.signo ? sig(t) : nat(t)}</text>`;
  if(o.meta != null) s += `<line class="obj" x1="${pl}" x2="${W - pr}" y1="${Y(o.meta).toFixed(1)}" y2="${Y(o.meta).toFixed(1)}"/>`;
  s += `<path class="ln" d="${prom.map((x, k) => (k ? "L" : "M") + X(x.i).toFixed(1) + " " + Y(x.v).toFixed(1)).join(" ")}"/>`;
  for(const x of pts) s += `<g data-tip="${esc(x.g.campeon)}, ${fechaCorta(x.g.fecha)}: ${fmt(x.v)} · ${x.g.victoria ? "victoria" : "derrota"}"><circle cx="${X(x.i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="12" fill="transparent"/><circle class="${x.g.victoria ? "cv" : "cd"}" cx="${X(x.i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="5"/></g>`;
  const u = prom[prom.length - 1];
  s += `<text class="ult" x="${(X(u.i) + 10).toFixed(1)}" y="${(Y(u.v) + 4).toFixed(1)}">${fmt(u.v)}</text></svg>`;
  const a = media(pts.slice(0, 5).map(x => x.v)), b = media(pts.slice(-5).map(x => x.v));
  let tend = `<span class="chip">Aún pocas partidas para ver si mejoras</span>`;
  if(pts.length >= 8){
    const mejor = o.menor ? b < a : b > a, igual = Math.abs(b - a) < (o.umbral || .3);
    tend = igual ? `<span class="chip">Igual que al principio</span>` : `<span class="chip ${mejor ? "vd" : "rj"}">${ic(b > a ? "sube" : "baja")}${mejor ? "Mejorando" : "Empeorando"}: de ${fmt(a)} a ${fmt(b)}</span>`;
  }
  return `<div class="mini" data-ancho="mini"><h3>${o.titulo}</h3><div class="mv"><b class="nm">${fmt(b)}</b><small>media de tus últimas ${Math.min(5, pts.length)}${o.meta != null ? ` · meta ${o.menor ? "≤" : "≥"} ${o.signo ? sig(o.meta) : nat(o.meta)}` : ""}</small></div>${tend}${s}</div>`;
}

/* Cuándo juegas mejor (EasyUI "Activity Heatmap"): día de la semana por franja de 4 horas, con tu % de victorias */

          <div class="desl"><input type="range" min="45" max="100" step="5" value="${Math.round((h.opacidad || .9) * 100)}" data-i="hud-op" aria-label="Opacidad"><b class="nm">${Math.round((h.opacidad || .9) * 100)}%</b></div></div>
        <div class="aj-f"><div><b>Tamaño</b><small>Súbelo si juegas en 1440p o 4K.</small></div>
          <div class="desl"><input type="range" min="85" max="150" step="5" value="${Math.round((h.escala || 1) * 100)}" data-i="hud-esc" aria-label="Tamaño"><b class="nm">${Math.round((h.escala || 1) * 100)}%</b></div></div>
        <div class="aj-f al"><div><b>Posición</b><small>${esc(lugarTxt)}. Elige una esquina o colócalas a mano.</small></div>
          <div class="pant" role="group" aria-label="Posición de las tarjetas">${LUGARES.map(([k, n]) => `<button class="${h.lugar === k ? "on" : ""}" data-a="hud-lugar" data-l="${k}" data-tip="${n}" aria-label="${n}" aria-pressed="${h.lugar === k}"><i></i></button>`).join("")}</div></div>
        <div class="aj-f"><div><b>Temporizadores de objetivos</b><small>Dragón, larvas o Heraldo y Barón, siempre a la vista. En dorado cuando falta poco.</small></div>
          <button class="sw ${h.timers !== false ? "on" : ""}" role="switch" aria-checked="${h.timers !== false}" data-a="hud-timers" aria-label="Temporizadores de objetivos"><i></i></button></div>
        <div class="aj-f"><div><b>Avisos de objetivos</b><small>Te dice qué hacer según tu línea antes de que salgan, y cuando alguien coge el Barón o el Anciano.</small></div>
          <div class="chips" role="group" aria-label="Avisos de objetivos">${OBJS_AV.map(([k, n]) => `<button class="chip ${av[k] !== false ? "az" : "ln"}" data-a="hud-av" data-k="${k}" aria-pressed="${av[k] !== false}">${n}</button>`).join("")}</div></div>
        <div class="aj-f"><div><b>Antelación del aviso</b><small>Cuánto antes de que salga el objetivo.</small></div>
          <div class="chips" role="group" aria-label="Antelación del aviso">${[30, 45, 60, 90].map(x => `<button class="chip ${ant === x ? "az" : "ln"}" data-a="hud-ant" data-s="${x}" aria-pressed="${ant === x}">${x} s</button>`).join("")}</div></div>
        <div class="aj-f"><div><b>Sonido con cada aviso</b><small>Un sonido corto de Windows para que no se te pase.</small></div>
          <button class="sw ${h.sonido !== false ? "on" : ""}" role="switch" aria-checked="${h.sonido !== false}" data-a="hud-sonido" aria-label="Sonido con cada aviso"><i></i></button></div>
      </div>
      <div class="pie izq"><button class="btn p" data-a="hud-probar">${ic("play", "s")}Probar 14 segundos</button><button class="btn" data-a="hud-mover">${ic("mover", "s")}Colocar a mano</button></div>
      <p class="nota-p">“Colocar a mano” las deja visibles con datos de ejemplo: arrástralas adonde quieras y se guardan solas. En plena partida: mantén <b>Ctrl</b> con el ratón encima y arrástralas. Usan solo lo que ves en la partida: tus números, el marcador del Tab y los objetivos que la partida anuncia a todos. Nada oculto del rival, como pide Riot.</p>
    </section></div>
    <div class="c5 pila">
      <section class="card" aria-label="Apariencia"><div class="card-h"><h2>${ic("sol")}Apariencia</h2></div>
        <div class="temas"><button class="${t === "oscuro" ? "on" : ""}" data-a="tema-fijo" data-t="oscuro" aria-pressed="${t === "oscuro"}"><span class="mu os"><i></i><i></i><i></i></span><b>Oscuro</b></button>
          <button class="${t === "claro" ? "on" : ""}" data-a="tema-fijo" data-t="claro" aria-pressed="${t === "claro"}"><span class="mu cl"><i></i><i></i><i></i></span><b>Claro</b></button></div>
        <p class="nota-p">También cambia la ventanita de la selección de campeón.</p></section>
      <section class="card" aria-label="Sobre el coach"><div class="card-h"><h2>${ic("info")}Sobre el coach</h2><span class="der"><span class="chip">Versión ${esc(e.version || "")}</span></span></div>
        <ul class="sobre"><li><span>Tus datos</span><b>Solo en tu PC, en la carpeta datos</b></li>
          <li><span>Partidas guardadas</span><b class="tn">${(e.cabecera && e.cabecera.total) || e.partidas.length}</b></li>
          <li><span>Builds y medias por rango</span><b>Lolalytics, en vivo</b></li>
          <li><span>Imágenes</span><b>Cliente de LoL y CommunityDragon</b></li>
          <li><span>Actualizaciones</span><b>${e.actualizacion && e.actualizacion.error ? esc(e.actualizacion.error)
            : e.actualizacion && e.actualizacion.pendiente ? `Hay una versión ${esc(e.actualizacion.pendiente)}: cierra y abre el coach`
            : "Automáticas al abrir el coach"}</b></li></ul>
        <p class="nota-p">¿Algo falla o tienes una idea? Copia el diagnóstico (no lleva tus claves) y pégalo en tu comentario.</p>
        <div class="pie izq"><button class="btn" data-a="diagnostico">${ic("info", "s")}Copiar diagnóstico</button>
          <button class="btn" data-a="feedback">Enviar comentario</button>
          <button class="btn pe mantener" data-a="salir" data-tip="Mantén pulsado para cerrar"><i class="hold" aria-hidden="true"></i>${ic("salir", "s")}<span>Cerrar el coach</span></button></div></section>
    </div></div>`;
};
async function hud(cambios, aviso){
  Object.assign(S.estado.hud = S.estado.hud || {}, cambios.accion ? {} : cambios); S.estadoTxt = ""; pintar(true);
  try{ const r = await api("/api/hud", cambios); if(!r.ok) toast(r.msg); else if(aviso) toast(aviso); }
  catch(e){ toast("No pude cambiarlo. ¿Está abierto el coach?"); }
}
A["hud-mini"] = () => hud({mini: !(E().hud || {}).mini});
A["hud-lugar"] = el => hud({lugar: el.dataset.l});
A["hud-timers"] = () => hud({timers: (E().hud || {}).timers === false});
A["hud-sonido"] = () => hud({sonido: (E().hud || {}).sonido === false});
A["hud-av"] = el => { const av = Object.assign({}, (E().hud || {}).avisos || {}); av[el.dataset.k] = av[el.dataset.k] === false; hud({avisos: av}); };
A["hud-ant"] = el => hud({antelacion: +el.dataset.s});
A["hud-probar"] = () => hud({accion: "probar"}, "Mira tu pantalla: las tarjetas se ven 14 segundos");
A["hud-mover"] = () => hud({accion: "mover"}, "Arrástralas adonde quieras: se guardan solas");
A["tema-fijo"] = async el => { if(el.dataset.t !== temaActual()) await A.tema(); };
I["hud-op"] = el => { const v = +el.value / 100; el.nextElementSibling.textContent = el.value + "%"; S.estado.hud.opacidad = v; S.estadoTxt = ""; clearTimeout(I._t1); I._t1 = setTimeout(() => api("/api/hud", {opacidad: v}).catch(() => {}), 180); };
I["hud-esc"] = el => { const v = +el.value / 100; el.nextElementSibling.textContent = el.value + "%"; S.estado.hud.escala = v; S.estadoTxt = ""; clearTimeout(I._t2); I._t2 = setTimeout(() => api("/api/hud", {escala: v}).catch(() => {}), 180); };
document.addEventListener("input", ev => { const el = ev.target.closest && ev.target.closest("[data-i]"); if(el && I[el.dataset.i]) I[el.dataset.i](el); });

/* =========================================== AVISO "PARA POR HOY" =========================================== */
function revisarAviso(){
  const s = E().sesion, m = $("#aviso");
  if(!(s.parada && (s.mostrar_aviso || S.forzarAviso))){ m.classList.remove("on"); S.avisoClave = null; return; }
  if(S.avisoClave === s.clave_aviso && m.classList.contains("on")) return;
  S.avisoClave = s.clave_aviso;
  poner($("#aviso-c"), `<p class="et c-rj"><i class="pt"></i>Regla anti-racha</p><h2 class="dz" id="aviso-t">Para por hoy</h2>
    <ul class="motivos">${s.motivos.map(x => `<li>${ic("alerta", "s")}<span>${esc(x.texto)}</span></li>`).join("")}</ul>
    ${s.despues_del_aviso ? `<p class="despues">Ya jugaste ${plural(s.despues_del_aviso, "partida", "partidas")} después de este aviso.</p>` : ""}
    <p class="t2">Con la cabeza caliente se pierde más LP del que se gana. Lo que juegues ahora va a salir peor que lo que jugaste antes.</p>
    <div class="av-lista">${s.lista.map(g => `<div class="${g.victoria ? "v" : "d"}">${cp(g.campeon_id, g.campeon, 44)}<span class="tn">${esc(g.kda)}</span></div>`).join("")}</div>
    <div class="av-res"><div><b class="nm">${s.victorias}V – ${s.derrotas}D</b><span>${plural(s.partidas, "partida", "partidas")} hoy</span></div>
      <div><b class="nm">${dec(s.muertes_prom)}</b><span>muertes por partida</span></div><div><b class="nm">${dec(s.nota_prom)}</b><span>nota media del coach</span></div></div>
    <p class="t2">Mañana a partir de las ${esc(s.hora_reinicio)} el contador vuelve a cero.</p>
    <div class="rev-acc"><button class="btn p gr" data-a="aviso-ok" id="entendido">Entendido, paro</button></div>`);
  m.classList.add("on");
  const b = $("#entendido"); if(b) b.focus();
}
A["aviso-ok"] = async () => {
  $("#aviso").classList.remove("on"); S.forzarAviso = false;
  if(location.hash === "#aviso") history.replaceState(null, "", "#" + S.vista);
  try{ await api("/api/aviso-visto", {}); S.estado.sesion.mostrar_aviso = false; S.estadoTxt = ""; }catch(_){}
};

/* =========================================== CICLO =========================================== */
const escribiendo = () => { const a = document.activeElement; return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "range")) && a.value.trim().length > 0; };
async function refrescar(){
  let txt;
  try{ txt = await leerEstado(); }
  catch(_){
    if(S.estado && !S.caido){ S.caido = true; pintar(true); }
    else if(!S.estado) $("#carga-t").textContent = "No encuentro al coach. Ábrelo con INICIAR_COACH.bat y esta página se conecta sola.";
    return;
  }
  const primera = !S.estado, volvio = S.caido;
  S.caido = false;
  if(txt === S.estadoTxt && !volvio) return;                  /* nada cambió: no se toca la pantalla */
  const antes = S.estado, nuevo = JSON.parse(txt);
  /* el coach se actualizó con esta página abierta: se recarga sola (una vez por versión) para no quedarse con la interfaz vieja */
  if(UI_V && nuevo.version && nuevo.version !== UI_V){
    let ya = null; try{ ya = sessionStorage.getItem("coach-recarga"); }catch(_){}
    if(ya !== nuevo.version){ try{ sessionStorage.setItem("coach-recarga", nuevo.version); }catch(_){} location.reload(); return; }
  }
  const lAntes = antes ? logrosDe(antes) : null;
  S.estado = nuevo; S.estadoTxt = txt;
  const e = S.estado, ids = e.partidas.map(p => String(p.id));
  if(lAntes != null && logrosDe(e) > lAntes){ setTimeout(confeti, 300); setTimeout(() => toast("¡Superaste un reto! Míralo en Retos o en Progreso"), 3400); }
  const nov = e.actualizacion && e.actualizacion.novedades;
  if(primera && nov){
    let visto = null; try{ visto = localStorage.getItem("coach-novedades"); }catch(_){}
    if(visto !== nov.a){ try{ localStorage.setItem("coach-novedades", nov.a); }catch(_){}
      setTimeout(() => toast(`Coach actualizado a la versión ${nov.a}${nov.notas ? ": " + nov.notas : ""}`), 600); }
  }
  if(e.tema && e.tema !== temaActual() && (primera || !antes || antes.tema !== e.tema)) ponerTema(e.tema);
  try{ localStorage.setItem("coach-tema", temaActual()); }catch(_){}
  if(primera){
    $("#carga").remove(); $(".app").hidden = false;
    S.vistaNueva = e.ultima_nueva;
    const h = location.hash.slice(1), m = h.match(/^partidas?[\/=](\d+)/);
    if(m && ids.includes(m[1])) await ir("partidas", {id: m[1]});
    else if(h === "partida") await ir("partidas");
    else if(h === "plan" || h === "aviso") await ir("inicio");
    else await ir(TITULO[h.split("/")[0]] ? h.split("/")[0] : "inicio");
    revisarAviso(); return;
  }
  if(e.ir && !escribiendo()){                     /* el coach pide enseñar algo en esta ventana en vez de abrir otra */
    const m = e.ir.match(/^partidas?[\/=](\d+)/);
    if(e.ir === "aviso"){ S.forzarAviso = true; revisarAviso(); }
    else if(m && ids.includes(m[1])){ S.vistaNueva = e.ultima_nueva; await ir("partidas", {id: m[1]}); revisarAviso(); return; }
  }
  if(e.ultima_nueva && e.ultima_nueva !== S.vistaNueva){
    S.vistaNueva = e.ultima_nueva; S.prog = null;
    S.llega = String(e.ultima_nueva); clearTimeout(S._llegaT); S._llegaT = setTimeout(() => { S.llega = null; pintar(true); }, 1600);
    toast("Partida nueva analizada");
    if(!escribiendo() && !$("#rev").classList.contains("on") && ids.includes(String(e.ultima_nueva))){ await ir("partidas", {id: e.ultima_nueva}); revisarAviso(); return; }
  }
  const cambio = k => JSON.stringify(antes[k]) !== JSON.stringify(e[k]);
  if(S.vista === "progreso" && (cambio("partidas") || cambio("revision") || cambio("entreno"))) cargarProgreso();
  if(S.vista === "retos" && (cambio("retos_activos") || cambio("partidas"))) cargarRetos();
  if(S.vista === "partidas" && S.partida && cambio("partidas") && !escribiendo()) recargarPartida().then(() => pintar());
  if(S.vista === "partidas" && !S.selId && ids.length) ir("partidas");
  pintar();
  revisarAviso();
}
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if(h === "aviso"){ S.forzarAviso = true; if(S.estado) revisarAviso(); return; }
  if(!S.estado) return;
  const m = h.match(/^partidas?[\/=](\d+)/);
  if(m) ir("partidas", {id: m[1]}); else if(TITULO[h] && h !== S.vista) ir(h);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden) refrescar(); });
refrescar();
setInterval(refrescar, 4000);        /* también en segundo plano: así el coach sabe que la página sigue abierta */

</script>
